# Cuts a release when a version tag is pushed: builds the compiler for
# macOS (Apple silicon and Intel) and Linux, runs the whole suite on each,
# and attaches the binaries to a GitHub Release.
#
# Copy this file to .github/workflows/release.yml — see ci/README.md for
# why it does not live there already.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            name: keal-macos-arm64
          # GitHub is retiring the macOS 13 runners; `macos-15-intel` is the
          # Intel one that still exists. A leg whose runner never comes is a
          # release that never opens, so this label matters.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: keal-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: keal-linux-x86_64
          # Windows is held to the same standard as the rest, and blocks
          # like the rest. What it needs beyond the others is a C compiler
          # that is not MSVC — see the step below, and `docs/interop.md`
          # for why.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: keal-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A Windows runner has no `cc`, and the compiler this runtime needs is
      # not MSVC: overflow is checked with GCC and Clang builtins. Nor is any
      # compiler enough — an LLVM `clang` on a Windows runner targets MSVC,
      # rejects `-pthread`, and would satisfy a naive "does a compiler
      # answer" check while building nothing. So the test is what the
      # toolchain IS, not that one exists, and the step asserts the answer
      # rather than trusting it: without this every test that compiles C
      # skips itself, and a green Windows leg would mean far less than it
      # appears to.
      # A Windows runner has no `cc`, and the compiler this runtime needs is
      # not MSVC. The script asserts what it installed rather than trusting
      # it, and lives in the repository so its logic can change without
      # pasting this file through a web UI again.
      - name: A C compiler that is not MSVC
        if: runner.os == 'Windows'
        shell: bash
        run: bash ci/windows-toolchain.sh

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Says which toolchains this runner has, so a skipped test in the log
      # below can be read as a fact about the machine rather than a mystery.
      - name: What this machine has
        shell: bash
        run: |
          bin=./target/${{ matrix.target }}/release/keal
          [ -x "$bin.exe" ] && bin="$bin.exe"
          "$bin" doctor || true

      # The suite is the release criterion: three engines agreeing, the
      # self-hosted twins byte-identical, and the bootstrap fixed point.
      - name: Test
        run: cargo test --release

      # The bootstrap compiles the self-hosted compiler through C, so it
      # needs the toolchain the step above installs. `shell: bash` because
      # PowerShell is the default on Windows and cannot run a `.sh`; Git Bash
      # is there, and the script runs clean under it.
      - name: Bootstrap to its fixed point
        shell: bash
        run: ./bootstrap.sh

      - name: Package
        shell: bash
        run: |
          mkdir -p dist-release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/keal.exe dist-release/keal.exe
          else
            cp target/${{ matrix.target }}/release/keal dist-release/keal
          fi
          cp README.md LICENSE dist-release/
          tar -czf ${{ matrix.name }}.tar.gz -C dist-release .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # `body_path` is the notes a person wrote; `generate_release_notes`
      # appends GitHub's commit list under them. The commit list is raw
      # material, not notes — it says what changed, never what it means.
      # The notes are the tag's own message — written when the tag was cut,
      # by whoever knew what it contained — above the permanent footer that
      # says how to install the thing. GitHub's generated commit list goes
      # under both: raw material, not notes.
      - name: Compose the notes
        shell: bash
        run: |
          tag='${{ inputs.tag || github.ref_name }}'
          git fetch --force --tags --quiet origin "$tag"
          git tag -l --format='%(contents)' "$tag" > notes.md
          printf '\n' >> notes.md
          cat ci/release-notes.md >> notes.md
          cat notes.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*.tar.gz
          body_path: notes.md
          generate_release_notes: true
          draft: true
