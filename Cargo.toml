[package]
name = "keal"
version = "0.5.0"
edition = "2021"
description = "Keal — a statically typed scripting language"

[[bin]]
name = "keal"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
# One unit lets the optimiser see the whole dispatch loop at once, which is
# where nearly all of a VM's time goes.
codegen-units = 1
panic = "abort"
